name: Research tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s tests -v
